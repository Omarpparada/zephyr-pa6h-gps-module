CONFIG_PA6H=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Referencia zephyr/samples/sensor/sht3xd/prj.conf
CONFIG_STDOUT_CONSOLE=y

# logging
CONFIG_LOG=y
CONFIG_SENSOR_LOG_LEVEL_DBG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Necesario para que se incluya el sensor
CONFIG_SENSOR=y
CONFIG_CBPRINTF_FP_SUPPORT=y